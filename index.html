 .pick{width:100%!important;height:auto!important;max-height:none!important;aspect-ratio:1250/2049!important;align-self:start!important;border-width:3px!important}.pick:before{width:20px!important;height:20px!important;font-size:12px!important}.pick:hover,.pick.selected{transform:none!important}
 .confirm-main{display:block!important;position:relative!important;z-index:20!important;width:min(72%,300px)!important;height:29px!important;min-height:29px!important;margin:0 auto!important;border-width:3px!important;font-size:10px!important}
 .controls{height:68px!important;display:flex!important;align-content:center!important;gap:3px!important;overflow:hidden!important}.controls button{min-width:calc(25% - 4px)!important;height:31px!important;border-width:3px!important;font-size:8px!important;padding:1px!important}
 .footer{height:20px!important;font-size:7px!important;line-height:1.1!important;overflow:hidden!important;padding:0!important}
}
</style></head><body><section class="parent-select" id="parentSelect"><div class="parent-panel"><h2>親を選ぶ</h2><div class="parent-list"><button class="parent-card" data-parent="woman"><img src="assets/characters/woman.png" alt="若い女性"><b>麗子</b><span>初級｜順目と連続を好む</span></button><button class="parent-card" data-parent="yakuza"><img src="assets/characters/yakuza.png" alt="ヤクザ"><b>鬼塚</b><span>中級｜根っこと反対目を好む</span></button><button class="parent-card" data-parent="master"><img src="assets/characters/master.png" alt="老練な博徒"><b>玄斎</b><span>上級｜こちらの癖を読んでくる</span></button></div></div></section><main class="game">
<header class="header"><div class="title">堅気屋 手本引き</div><div class="crest"></div><div class="credit"><small>CREDIT</small><span id="credits">1000</span></div></header>
<section class="status"><div class="meter"><span>BET</span><b id="bet">10</b></div><div class="message" id="message">張り方を決めて「親 入りました」</div><div class="meter"><span>張り方</span><b id="typeName">スイチ</b></div></section>
<section class="table"><div class="dealer"><button class="change-parent" id="changeParent">親変更</button><div class="label">親の手本</div><img id="dealerFace" class="dealer-face" src="assets/characters/woman.png" alt=""><span class="parent-name" id="parentName">麗子</span><div id="dealerCard" class="dealer-card back"></div><div class="history" id="history"></div></div><div class="bet-area"><div class="types" id="types"></div><div class="slots" id="slots"></div><div class="picks" id="picks"></div></div></section><button class="confirm confirm-main" id="confirmBtn" disabled>この張りで勝負</button>
<section class="controls"><button id="betBtn">BET +10</button><button id="maxBtn">MAX BET</button><button class="red" id="startBtn">親 入りました</button><button id="clearBtn">張り直し</button><button id="soundBtn">SOUND ON</button><button id="fullBtn">FULL SCREEN</button><button id="resetBtn">RESET</button></section>
<footer class="footer">大→中→止→角の順に札を選択｜目木は直近6回の出目｜ゲーム内クレジット専用　<b>©2026 YOSHiYUKi</b><br>札絵: Louie Mantia / CC BY-SA 4.0</footer>
</main><script>
const $=id=>document.getElementById(id);let credits=Number(localStorage.getItem('tehonCredits')||1000),bet=10,phase='ready',answer=0,type=1,selections=[],history=JSON.parse(localStorage.getItem('tehonHistory')||'[]'),playerReads=JSON.parse(localStorage.getItem('tehonReads')||'[]'),parent=localStorage.getItem('tehonParent')||'',soundOn=localStorage.getItem('tehonSound')!=='off',audioCtx=null;
const cards=['','Hanafuda_January_Hikari.png','Hanafuda_February_Tane.png','Hanafuda_March_Hikari.png','Hanafuda_April_Tane.png','Hanafuda_May_Tane.png','Hanafuda_June_Tane.png'];
const names=['','一・松','二・梅','三・桜','四・藤','五・菖蒲','六・牡丹'];
const rules={1:{name:'スイチ',pos:['大'],pay:[4.5]},2:{name:'ケッタツ',pos:['大','中'],pay:[3.5,0]},3:{name:'クイチ',pos:['大','中','止'],pay:[1.5,1,.3]},4:{name:'安張り',pos:['大','中','止','角'],pay:[1.2,.6,.2,-.2]}};
const parents={woman:{name:'麗子',face:'woman.png'},yakuza:{name:'鬼塚',face:'yakuza.png'},master:{name:'玄斎',face:'master.png'}};
function tone(f,d=.08,delay=0){if(!soundOn)return;audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+delay;o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.025,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+d)}
function sfx(n){if(n==='start')[330,450,590].forEach((f,i)=>tone(f,.06,i*.07));if(n==='win')[523,659,784,1047].forEach((f,i)=>tone(f,.13,i*.1));if(n==='lose'){tone(145,.25);tone(90,.3,.15)}if(n==='click')tone(780,.06)}
function pickHTML(n){const order=selections.indexOf(n);return `<div class="pick ${phase==='choosing'?'':'disabled'} ${order>=0?'selected':''}" data-number="${n}" data-order="${order>=0?rules[type].pos[order]:''}" data-n="${n}"><img src="assets/cards/${cards[n]}" alt="${names[n]}"></div>`}
function render(){const r=rules[type];$('types').innerHTML=[1,2,3,4].map(n=>`<button data-t="${n}" class="${n===type?'on':''}" ${phase!=='ready'?'disabled':''}>${n}点 ${rules[n].name}</button>`).join('');$('slots').innerHTML=r.pos.map((p,i)=>`<span class="slot"><b>${p}</b> ${selections[i]?names[selections[i]]:'—'}（${r.pay[i]===0?'種':r.pay[i]+'倍'}）</span>`).join('');$('picks').innerHTML=[1,2,3,4,5,6].map(pickHTML).join('');$('history').innerHTML=history.map(n=>`<i>${n}</i>`).join('');$('credits').textContent=credits;$('bet').textContent=bet;$('typeName').textContent=r.name;$('startBtn').disabled=phase!=='ready';$('betBtn').disabled=phase!=='ready';$('maxBtn').disabled=phase!=='ready';$('clearBtn').disabled=phase!=='choosing';$('confirmBtn').disabled=phase!=='choosing'||selections.length!==type;if(phase==='ready')[...$('types').children].forEach(el=>el.onclick=()=>{type=Number(el.dataset.t);selections=[];render()});if(phase==='choosing')[...$('picks').children].forEach(el=>el.onclick=()=>selectCard(Number(el.dataset.n)))}
const stableRender=render;render=()=>{stableRender();$('history').innerHTML=history.map(n=>`<span class="hist-card"><img src="assets/cards/${cards[n]}" alt="${names[n]}"><b>${n}</b></span>`).join('')};
function chooseAnswer(){const last=history[0]||1,r=Math.random();if(parent==='woman'){if(r<.32)return last%6+1;if(r<.54)return last;if(r<.72)return 7-last;return 1+Math.floor(Math.random()*6)}if(parent==='yakuza'){if(r<.48)return last;if(r<.78)return 7-last;return 1+Math.floor(Math.random()*6)}if(parent==='master'&&playerReads.length){const count=[0,0,0,0,0,0,0];playerReads.forEach(n=>count[n]++);const min=Math.min(...count.slice(1)),safe=[];for(let n=1;n<=6;n++)if(count[n]===min)safe.push(n);if(r<.7)return safe[Math.floor(Math.random()*safe.length)]}return 1+Math.floor(Math.random()*6)}
function start(){if(!parent){$('parentSelect').style.display='grid';return}if(credits<bet){$('message').textContent='CREDIT不足';sfx('lose');return}answer=chooseAnswer();phase='choosing';selections=[];$('dealerCard').className='dealer-card back';$('dealerCard').innerHTML='';$('message').textContent=`${parents[parent].name} 入りました　${rules[type].name}で張れ`;sfx('start');render()}
function selectCard(n){if(phase!=='choosing'||selections.includes(n)||selections.length>=type)return;selections.push(n);sfx('click');render()}
function reveal(){if(phase!=='choosing'||selections.length!==type)return;credits-=bet;phase='result';playerReads.push(selections[0]);playerReads=playerReads.slice(-30);localStorage.setItem('tehonReads',JSON.stringify(playerReads));$('dealerCard').className='dealer-card reveal';$('dealerCard').innerHTML=`<img src="assets/cards/${cards[answer]}" alt="${names[answer]}">`;const idx=selections.indexOf(answer);if(idx>=0){const mult=rules[type].pay[idx],returned=Math.floor(bet*(1+mult)),net=returned-bet;credits+=returned;const result=mult===0?'種・元返し　収支 ±0':mult<0?`角受け　収支 ${net}`:`${rules[type].pos[idx]}で受け　獲得 ${returned}／純増 +${net}`;$('message').textContent=`的中！ ${names[answer]}　${result}`;sfx('win')}else{$('message').textContent=`総抜け　手本は ${names[answer]}　収支 -${bet}`;sfx('lose')}history.unshift(answer);history=history.slice(0,6);localStorage.setItem('tehonHistory',JSON.stringify(history));localStorage.setItem('tehonCredits',credits);render();setTimeout(()=>{phase='ready';selections=[];render()},850)}
$('startBtn').onclick=start;$('confirmBtn').onclick=reveal;$('clearBtn').onclick=()=>{if(phase==='choosing'){selections=[];render()}};$('betBtn').onclick=()=>{if(phase!=='ready')return;bet=bet>=100?10:bet+10;sfx('click');render()};$('maxBtn').onclick=()=>{if(phase!=='ready')return;bet=Math.min(100,credits);sfx('click');render()};$('soundBtn').onclick=()=>{soundOn=!soundOn;localStorage.setItem('tehonSound',soundOn?'on':'off');$('soundBtn').textContent=soundOn?'SOUND ON':'SOUND OFF';if(soundOn)sfx('click')};$('fullBtn').onclick=async()=>{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()};$('resetBtn').onclick=()=>{if(confirm('クレジットと目木を初期化しますか？')){credits=1000;history=[];localStorage.setItem('tehonCredits',credits);localStorage.setItem('tehonHistory','[]');phase='ready';selections=[];$('dealerCard').className='dealer-card back';$('dealerCard').innerHTML='';$('message').textContent='張り方を決めて「親 入りました」';render()}};render();
function setParent(key){parent=key;localStorage.setItem('tehonParent',key);$('dealerFace').src='assets/characters/'+parents[key].face;$('parentName').textContent=parents[key].name;$('parentSelect').style.display='none';$('message').textContent=parents[key].name+'と勝負　張り方を選べ'}
[...document.querySelectorAll('.parent-card')].forEach(el=>el.onclick=()=>setParent(el.dataset.parent));$('changeParent').onclick=()=>{if(phase==='ready')$('parentSelect').style.display='grid'};if(parent&&parents[parent])setParent(parent);else $('parentSelect').style.display='grid';
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script></body></html>
